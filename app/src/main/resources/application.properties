spring.application.name=app

# Database Configuration (PostgreSQL via Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/clinicdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=clinic_user
spring.datasource.password=clinic_password

# H2 Console (disabled — using PostgreSQL)
spring.h2.console.enabled=false

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Note: In production, the secret key should be injected via environment variables.
application.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Appointment Settings
clinic.appointment.default-duration=30

# Document Settings
clinic.document.upload-dir=./uploads


logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.access=TRACE
logging.level.org.springframework.web=DEBUG